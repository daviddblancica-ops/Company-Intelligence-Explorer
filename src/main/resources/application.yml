spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:companyintel;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  integrations:
    ares:
      connect-timeout: 3s
      read-timeout: 10s
  security:
    csrf-enabled: true
    users:
      admin:
        username: ${APP_ADMIN_USERNAME:admin}
        password: ${APP_ADMIN_PASSWORD:admin-local-2026}
      editor:
        username: ${APP_EDITOR_USERNAME:editor}
        password: ${APP_EDITOR_PASSWORD:editor-local-2026}
      viewer:
        username: ${APP_VIEWER_USERNAME:viewer}
        password: ${APP_VIEWER_PASSWORD:viewer-local-2026}
