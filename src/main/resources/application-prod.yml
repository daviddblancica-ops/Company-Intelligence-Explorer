spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration/mariadb
    validate-on-migrate: true
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Prague
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: lax

app:
  security:
    csrf-enabled: true
    users:
      admin:
        username: ${APP_ADMIN_USERNAME}
        password: ${APP_ADMIN_PASSWORD}
      editor:
        username: ${APP_EDITOR_USERNAME}
        password: ${APP_EDITOR_PASSWORD}
      viewer:
        username: ${APP_VIEWER_USERNAME}
        password: ${APP_VIEWER_PASSWORD}
